name: Inspect requested article layouts
on:
  push:
    branches: [fix/mission-openings-and-vessel-spacing]
    paths: [.github/workflows/layout-inspection.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect pinned sources and published route identities
        run: |
          python3 - <<'PY'
          import json, struct, urllib.request, time
          pin = 'ccefc5a5c3d79409cc78319f94b5490718d30670'
          root = 'https://raw.githubusercontent.com/trueChristian/'
          def get(url):
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'remnant-layout-review'}), timeout=90) as response:
                          return response.read()
                  except Exception:
                      if attempt == 2: raise
                      time.sleep(2)
          routes = json.loads(get(root + 'remnant.truechristian.church/publication-state/routes.json'))
          index = json.loads(get(root + 'berean-voice/' + pin + '/index.json'))
          names = ['children-or-kids', 'the-foolish-weak-nonexistent-things-vs-the-wise-mighty-and-existing-powers', 'the-year-2000', 'holy-sacrifices', 'the-wonderful-privilege-of-gospel-spreading', 'painful-realities-of-missionary-life', 'precious-letters-from-our-readers-24', 'a-chosen-vessel']
          by_id = {article['id']: article for article in index['articles']}
          def dimensions(data):
              if data.startswith(b'\x89PNG\r\n\x1a\n'): return struct.unpack('>II', data[16:24])
              if data[:2] == b'\xff\xd8':
                  offset = 2
                  while offset < len(data):
                      if data[offset] != 255: raise ValueError('Invalid JPEG marker')
                      while data[offset] == 255: offset += 1
                      marker = data[offset]; offset += 1
                      if marker in [0xd8,0xd9,0x01] or 0xd0 <= marker <= 0xd7: continue
                      length = int.from_bytes(data[offset:offset+2], 'big')
                      if marker in [0xc0,0xc1,0xc2,0xc3,0xc5,0xc6,0xc7,0xc9,0xca,0xcb,0xcd,0xce,0xcf]:
                          height,width = struct.unpack('>HH',data[offset+3:offset+7]);return width,height
                      offset += length
              raise ValueError('Unsupported image')
          for alias in names:
              matches = [(identity, route) for identity,route in routes['articles']['en'].items() if route['alias'] == alias]
              assert len(matches) == 1, (alias, matches)
              identity, route = matches[0]; article = by_id[identity]
              result = {'id':identity, 'title':article['title'], 'url':'/en/'+route['category_slug']+'/'+alias+'/', 'images':[]}
              for image in article.get('images',[]):
                  data = get(root + 'berean-voice/' + pin + '/' + image['repository_path'])
                  result['images'].append({'name':image['repository_path'].rsplit('/',1)[-1], 'size':dimensions(data), 'alt':image.get('alt'), 'bytes':len(data)})
              print('LAYOUT_INPUT '+json.dumps(result,ensure_ascii=False), flush=True)
          PY
