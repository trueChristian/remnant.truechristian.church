name: Prepare requested layout review inputs

on:
  push:
    branches: [fix/soul-sculpture-poetry-konkomba-layouts]
    paths: [.github/workflows/layout-review-inputs.yml]

permissions:
  contents: read

jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: trueChristian/berean-voice
          ref: ccefc5a5c3d79409cc78319f94b5490718d30670
          path: .review/source
          persist-credentials: false
      - name: Prepare original financial-report assets and record provenance
        run: |
          mkdir -p .review/inputs
          python3 - <<'PY'
          import json, pathlib, subprocess, tarfile
          root = pathlib.Path('.review/source')
          records = json.loads((root / 'index.json').read_text())['articles']
          record, = [r for r in records if r['id'] == 'e287ea36-8b9d-4d08-aa35-d9a6b7113981']
          with tarfile.open('.review/inputs/images.tar', 'w') as out:
              for image in record['images']:
                  name = image['repository_path']
                  out.add(root / name, arcname=name)
          provenance = {'english': subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip(), 'article': record}
          pathlib.Path('.review/inputs/provenance.json').write_text(json.dumps(provenance, indent=2, ensure_ascii=False) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: financial-layout-inputs
          path: .review/inputs/
          retention-days: 1
