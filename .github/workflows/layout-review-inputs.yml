name: Prepare requested layout review inputs
on:
  push:
    branches: [fix/soul-sculpture-poetry-konkomba-layouts]
    paths: [.github/workflows/layout-review-inputs.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: trueChristian/berean-voice
          ref: ccefc5a5c3d79409cc78319f94b5490718d30670
          persist-credentials: false
      - name: Retain exact original artwork for the additional requests
        run: |
          mkdir -p .review
          python3 - <<'PY'
          import json, pathlib, tarfile, hashlib
          identities = {'a5232cdc-2e95-42b0-85f1-b2bfd9ad160c', '7a66963a-8f7e-4083-bed3-227b354fae1b', 'ea463a08-df2c-4fdf-96c4-5833e4100265', 'e38dca23-911a-42b6-96a2-de9ff0c4bb87'}
          records = [r for r in json.loads(pathlib.Path('index.json').read_text())['articles'] if r['id'] in identities]
          assert len(records) == len(identities)
          hashes = {}
          with tarfile.open('.review/images.tar', 'w') as output:
              for record in records:
                  for image in record['images']:
                      path = pathlib.Path(image['repository_path'])
                      output.add(path, arcname=str(path))
                      hashes[str(path)] = hashlib.sha256(path.read_bytes()).hexdigest()
          pathlib.Path('.review/hashes.json').write_text(json.dumps(hashes, indent=2))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: remaining-layout-artwork
          path: .review/
          include-hidden-files: true
          retention-days: 1
