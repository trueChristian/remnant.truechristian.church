name: Validate and commit reviewed article layouts
on:
  push:
    branches: [fix/soul-sculpture-poetry-konkomba-layouts]
    paths: [.github/workflows/layout-review-inputs.yml]
permissions:
  contents: write
concurrency:
  group: apply-reviewed-article-layouts
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'trueChristian/remnant.truechristian.church' && github.ref == 'refs/heads/fix/soul-sculpture-poetry-konkomba-layouts'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify and apply the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          encoded = pathlib.Path('.review/layout-changes.b64').read_text().strip()
          # Correct two identified transport transcription insertions. The exact
          # original patch hash below remains authoritative; any other difference fails.
          encoded = encoded.replace('Prl79+Prl191', 'Prl79+Pr191').replace('MGSE1A/zY8c8ow', 'MGSE1A/zY8cow')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '8643fb78bf9a49114e0a1a8d6fa381e705d7e84b9d2506629d36d4709eaebd86', 'Patch bytes differ from the locally verified result'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed-layouts.patch'
          path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          PY
      - name: Run the complete offline regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python3 -m unittest discover -s tests -v
          node --test tests/*.test.mjs
          for file in tests/browser/*.mjs assets/article-editorial.js assets/article-figures.js; do node --check "$file"; done
      - name: Commit only the exact reviewed tree and remove delivery helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .review/layout-changes.b64 .github/workflows/layout-review-inputs.yml
          git add assets/article-editorial.css assets/article-editorial.js assets/article-figures.js assets/site.css data/article-image-layouts.json docs/reviewed-editorial-layouts.md scripts/article_editorial.py scripts/article_figures.py tests/browser/editorial-layouts.spec.mjs tests/test_article_editorial.py
          git diff --cached --check
          test "$(git write-tree)" = 6feb6eef4d2e01f2dbd965331998a610f4e1a1e7
          test "$(git ls-remote origin refs/heads/fix/soul-sculpture-poetry-konkomba-layouts | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete reviewed article compositions and responsive contributor columns'
          git push origin HEAD:refs/heads/fix/soul-sculpture-poetry-konkomba-layouts
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Retain transport evidence if validation fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: layout-delivery-evidence
          path: .review/layout-changes.b64
          include-hidden-files: true
          retention-days: 1
