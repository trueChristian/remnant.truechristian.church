name: Review Water into Wine image placement

on:
  pull_request:

permissions:
  contents: read

jobs:
  browser-review:
    if: github.head_ref == 'fix/water-into-wine-opening-images'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the proposed layout for review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned browser tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify the isolated article fixture
        run: npx playwright test --config .review/playwright.config.mjs
      - name: Retain layout screenshots and measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: water-wine-layout-review-${{ github.run_id }}
          path: .test-output/water-wine/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
