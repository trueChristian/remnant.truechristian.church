name: Review website article image layouts

on:
  pull_request:

permissions:
  contents: read

jobs:
  browser-review:
    if: github.head_ref == 'fix/three-article-image-layouts'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the proposed layouts for review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the immutable published source archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: trueChristian/berean-voice
          ref: 6c3e27346b6b031f46e29e723e884fe8407806b7
          path: .review/archive
          persist-credentials: false
      - name: Prepare exact original-article fixtures
        run: python3 .review/prepare.py
      - name: Install pinned browser tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify the named articles and complete illustrated archive
        run: npx playwright test --config .review/playwright.config.mjs
      - name: Verify the permanent representative fixtures
        if: success() || failure()
        run: npx playwright test --config .review/regressions.config.mjs
      - name: Retain screenshots and measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: article-image-review-${{ github.run_id }}
          path: .test-output/article-layout-review/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
