name: Review Tribulation contour

on:
  pull_request:

permissions:
  contents: read

jobs:
  browser-review:
    if: github.head_ref == 'fix/tribulation-opening-contour'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the proposed layout for isolated review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned browser tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check the actual image and opening paragraph
        env:
          CONTOUR_IMAGE_PATH: .review/tribulation.png
        run: npx playwright test --config .review/playwright.config.mjs
      - name: Retain screenshots and geometry evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tribulation-contour-review-${{ github.run_id }}
          path: .test-output/tribulation-contour/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
